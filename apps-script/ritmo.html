<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Ritmo. App a sezioni per il telefono: barra in basso (Oggi, Sonno, Corpo, Casa, Analisi),
   intestazione compatta in alto, grafici interattivi da scorrere col dito. Tema notturno, chiaro se il telefono è chiaro. */
:root {
  --bg: #0a0f1e; --bg-2: #0e1528; --surface: #131b31; --surface-2: #1a2442; --surface-3: #22305a; --line: #243055;
  --fg: #eaeefa; --muted: #8e99ba; --faint: #5f6a8c;
  --accent: #a9bcff; --accent-2: #7fd8ea; --accent-3: #c6a8ff; --glow: rgba(140,160,255,.35);
  --good: #62d6a8; --warn: #f1c56e; --bad: #f58585;
  --band-good: rgba(98,214,168,.08); --band-warn: rgba(241,197,110,.10); --band-bad: rgba(245,133,133,.11);
  --st-deep: #5d70e6; --st-light: #93a6f7; --st-rem: #7fd8ea; --st-awake: #f1c56e;
  --star: rgba(255,255,255,.55); --nav: rgba(14,21,40,.82); --shadow: 0 10px 30px rgba(0,0,0,.35);
  --f-display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef1f8; --bg-2: #e6eaf6; --surface: #ffffff; --surface-2: #f1f4fb; --surface-3: #e3e8f6; --line: #dbe1ef;
  --fg: #111a2e; --muted: #59647f; --faint: #8a93ab;
  --accent: #3d56d4; --accent-2: #12829b; --accent-3: #7a4fd6; --glow: rgba(61,86,212,.16);
  --good: #19976a; --warn: #a3720c; --bad: #cc4247;
  --band-good: rgba(25,151,106,.07); --band-warn: rgba(163,114,12,.08); --band-bad: rgba(204,66,71,.08);
  --st-deep: #3d56d4; --st-light: #8d9fe9; --st-rem: #12829b; --st-awake: #c68d1b;
  --star: rgba(61,86,212,.25); --nav: rgba(255,255,255,.86); --shadow: 0 10px 30px rgba(30,40,80,.12);
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef1f8; --bg-2: #e6eaf6; --surface: #ffffff; --surface-2: #f1f4fb; --surface-3: #e3e8f6; --line: #dbe1ef;
  --fg: #111a2e; --muted: #59647f; --faint: #8a93ab;
  --accent: #3d56d4; --accent-2: #12829b; --accent-3: #7a4fd6; --glow: rgba(61,86,212,.16);
  --good: #19976a; --warn: #a3720c; --bad: #cc4247;
  --band-good: rgba(25,151,106,.07); --band-warn: rgba(163,114,12,.08); --band-bad: rgba(204,66,71,.08);
  --st-deep: #3d56d4; --st-light: #8d9fe9; --st-rem: #12829b; --st-awake: #c68d1b;
  --star: rgba(61,86,212,.25); --nav: rgba(255,255,255,.86); --shadow: 0 10px 30px rgba(30,40,80,.12);
  color-scheme: light; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .8rem; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* ---- guscio dell'app ---- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; display: flex; align-items: center; gap: 9px; }
.pulse { width: 22px; height: 22px; }
.pulse path { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: pulse 2.4s var(--ease) .2s forwards; }
@keyframes pulse { to { stroke-dashoffset: 0; } }
.stamp { font-size: .74rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: live 2.4s infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

main { max-width: 760px; margin: 0 auto; padding-top: 6px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 18px; animation: viewIn .45s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.vtitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.vtitle h1 { font-size: 1.6rem; font-weight: 700; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--nav); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.tab { display: grid; justify-items: center; gap: 2px; padding: 9px 0 8px; font-size: .68rem; color: var(--faint); transition: color .25s; position: relative; z-index: 1; }
.tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] svg { transform: translateY(-1px) scale(1.06); stroke: var(--accent); }
.tabpill { position: absolute; top: 6px; height: 38px; width: calc(20% - 16px); left: 8px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, transparent); transition: left .4s var(--ease); }

/* ---- componenti ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; min-width: 0; position: relative; }
.card.tap { cursor: pointer; transition: transform .2s var(--ease), border-color .2s; }
.card.tap:active { transform: scale(.985); }
.card.tap:hover { border-color: var(--surface-3); }
.chead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .68rem; text-transform: uppercase; letter-spacing: .11em; color: var(--muted); font-weight: 600; }
.chev { color: var(--faint); font-size: 1.1rem; line-height: 1; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; } }
.stat { background: var(--surface-2); border-radius: 14px; padding: 11px 12px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: .74rem; color: var(--muted); }
.stat .v { font-family: var(--f-data); font-size: 1.35rem; font-weight: 500; line-height: 1.2; white-space: nowrap; }
.stat .v small { font-size: .74rem; color: var(--muted); margin-left: 2px; }
.stat .s { font-size: .72rem; display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; background: var(--line); }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: .78rem; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid transparent; transition: background .2s, color .2s, border-color .2s; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--fg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { font-size: .74rem; font-weight: 600; padding: 5px 10px; border-radius: 9px; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); }

.big { font-family: var(--f-display); font-weight: 700; font-size: 2.6rem; line-height: 1; letter-spacing: -.02em; }
.big small { font-family: var(--f-body); font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.delta { font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); }

/* ---- apertura con anello ---- */
.hero { overflow: hidden; border-radius: 24px; padding: 18px; border: 1px solid var(--line);
  background:
    radial-gradient(1.2px 1.2px at 12% 22%, var(--star) 50%, transparent 51%), radial-gradient(1px 1px at 28% 72%, var(--star) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 46% 12%, var(--star) 50%, transparent 51%), radial-gradient(1px 1px at 66% 38%, var(--star) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 84% 16%, var(--star) 50%, transparent 51%), radial-gradient(1px 1px at 92% 70%, var(--star) 50%, transparent 51%),
    radial-gradient(110% 90% at 90% -20%, var(--glow), transparent 60%), linear-gradient(180deg, var(--bg-2), var(--surface)); }
.hero-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { width: 140px; height: 140px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; overflow: visible; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .n { font-family: var(--f-display); font-weight: 700; font-size: 2.7rem; line-height: 1; }
.ring .l { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-top: 5px; }
.ring .arc { transition: stroke-dashoffset 1.4s var(--ease); }
.ring.sm { width: 92px; height: 92px; } .ring.sm .n { font-size: 1.75rem; } .ring.sm .l { font-size: .55rem; }
@media (max-width: 400px) { .ring { width: 118px; height: 118px; } .ring .n { font-size: 2.3rem; } }
.hero h2 { font-size: 1.35rem; font-weight: 600; line-height: 1.2; }
.comp { display: grid; gap: 9px; }
.comprow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 40px; align-items: center; gap: 10px; font-size: .8rem; }
.track { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 1s var(--ease); }
.comprow .v { font-family: var(--f-data); text-align: right; }

/* ---- note ---- */
.note { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.nicon { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); }
.nicon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.note.bad .nicon { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.note.warn .nicon { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.note.good .nicon { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.note.info .nicon { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.note.bad, .note.warn, .note.good, .note.info { color: var(--fg); }
.note p { font-size: .88rem; } .note .tip { color: var(--muted); font-size: .8rem; margin-top: 2px; }

/* ---- grafici ---- */
.chart { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-data); font-size: 9.5px; fill: var(--faint); }
.chart .draw { transition: stroke-dashoffset 1.1s var(--ease); }
.chart .fade { opacity: 0; transition: opacity .9s var(--ease) .25s; }
.chart.on .fade { opacity: 1; }
.ctip { position: absolute; top: 0; transform: translateX(-50%); pointer-events: none; background: var(--surface-3); color: var(--fg); border-radius: 10px; padding: 5px 9px; font-size: .74rem; white-space: nowrap; box-shadow: var(--shadow); opacity: 0; transition: opacity .15s; z-index: 2; }
.ctip b { font-family: var(--f-data); font-weight: 500; }
.chart.scrub .ctip { opacity: 1; }
.cursor { opacity: 0; transition: opacity .15s; }
.chart.scrub .cursor { opacity: 1; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.hint { font-size: .72rem; color: var(--faint); }

/* ---- sonno ---- */
.nightnav { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 6px; }
.nightnav button.arr { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 1.1rem; transition: opacity .2s, transform .15s; }
.nightnav button.arr:active { transform: scale(.92); }
.nightnav button.arr:disabled { opacity: .3; }
.nightnav .when { text-align: center; }
.nightnav .when b { font-family: var(--f-display); font-size: 1.05rem; display: block; }
.stages { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
.stages i { display: block; height: 100%; flex: 0 1 0; transition: flex-grow 1s var(--ease); }
.slist { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: .72rem; }
.slist div { display: grid; gap: 1px; } .slist b { font-family: var(--f-data); font-weight: 500; font-size: .95rem; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.cal button { aspect-ratio: 1; border-radius: 5px; background: var(--surface-2); transition: transform .15s, box-shadow .2s; }
.cal button:active { transform: scale(.85); }
.cal button.sel { box-shadow: 0 0 0 2px var(--fg); }
.calscale { display: flex; align-items: center; gap: 4px; font-size: .7rem; color: var(--muted); }
.calscale i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---- analisi ---- */
.find { cursor: pointer; }
.find .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .64rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; }
.tag.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.tag.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.tag.n { color: var(--muted); border: 1px solid var(--line); }
.find h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
.find .body { display: grid; gap: 10px; overflow: hidden; max-height: 0; opacity: 0; transition: max-height .5s var(--ease), opacity .4s; }
.find.open .body { max-height: 900px; opacity: 1; }
.find .more { font-size: .75rem; color: var(--accent); font-weight: 600; }
.bars { display: grid; gap: 8px; align-items: end; }
.bar { display: grid; gap: 3px; }
.bar .col { height: 70px; display: flex; align-items: flex-end; }
.bar .fill { width: 100%; height: 0; border-radius: 7px 7px 3px 3px; background: color-mix(in srgb, var(--accent) 32%, transparent); transition: height .9s var(--ease); }
.bar.hi .fill { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, transparent)); }
.bar .v { font-family: var(--f-data); font-size: .9rem; }
.bar .k { font-size: .68rem; color: var(--muted); line-height: 1.3; }
.prog { display: grid; gap: 5px; font-size: .8rem; }
details.how summary { cursor: pointer; font-size: .82rem; color: var(--accent); font-weight: 600; list-style: none; }
details.how summary::-webkit-details-marker { display: none; }
details.how ul { margin: 8px 0 0; padding-left: 18px; font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }

.list { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: .86rem; }
.row:last-child { border-bottom: 0; }
.empty { font-size: .85rem; color: var(--muted); background: var(--surface-2); border-radius: 14px; padding: 14px; }
.foot { font-size: .72rem; color: var(--faint); text-align: center; padding-top: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; } }
</style>

  <div class="stamp" id="stamp"></div>
</div></header>
<main id="main"></main>

  const svgEl = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const avg = a => { const v = a.filter(isNum); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const median = a => { const v = a.filter(isNum).sort((x, y) => x - y); if (!v.length) return null; const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };

      c2.appendChild(head);
      const sel = pts.find(p => p[2] === n.date);
      lineChart(c2, { h: 200, series: [{ data: pts, color: 'var(--accent)', line: false, dots: pts.length > 60 ? 2 : 3, dotOpacity: .55 }, { data: roll, color: 'var(--accent)', w: 2.2, area: !isBed }],
        hlines: [[mean, 'var(--faint)']], xTicks: dateTicks, yFmt: isBed ? (v2 => clock(v2)) : null, mark: sel ? [sel[0], sel[1], 'var(--accent-2)'] : null,
        tip: p => `${dLabel(p[2])} · <b>${isBed ? clock(p[1]) : fmt(p[1], m[2])}</b> ${m[3]}`, onPick: p => { S.night = p[2]; rerender(); window.scrollTo({ top: 0, behavior: 'smooth' }); }, aria: 'Andamento ' + m[0] });
      c2.appendChild(h('div', 'legend', '<span><i class="sw" style="background:var(--accent);height:8px;width:8px;border-radius:50%;opacity:.55"></i>singole notti</span><span><i class="sw" style="background:var(--accent)"></i>media su 7 notti</span><span><i class="sw" style="background:var(--faint)"></i>media del periodo</span>'));
    } else c2.appendChild(h('p', 'empty', 'Nessun dato in questo periodo.'));
    v.appendChild(c2);

    // calendario
    const c3 = h('div', 'card');
    c3.appendChild(h('div', 'chead', '<span class="eyebrow">Calendario dello sleep score</span><span class="muted small">ultime 13 settimane</span>'));
    const cal = h('div', 'cal');
    const end = dayNum(gNights.length ? gNights[gNights.length - 1].date : n.date), endDow = (dow(fromDayNum(end)) + 6) % 7;
    const start = end - endDow - 7 * 12;
    const col = s => !isNum(s) ? 'var(--surface-2)' : s >= 85 ? 'var(--good)' : s >= 75 ? 'color-mix(in srgb, var(--good) 60%, var(--warn))' : s >= 60 ? 'var(--warn)' : s >= 45 ? 'color-mix(in srgb, var(--warn) 50%, var(--bad))' : 'var(--bad)';
    for (let d = start; d <= end + (6 - endDow); d++) {
      const ds = fromDayNum(d), x = byDate[ds], b = h('button');
      if (d > end) { b.style.visibility = 'hidden'; cal.appendChild(b); continue; }
      b.style.background = col(x && x.score); b.setAttribute('aria-label', dLabel(ds) + (x && isNum(x.score) ? ', score ' + x.score : ', nessun dato'));
      if (ds === n.date) b.classList.add('sel');
      if (x && (isNum(x.score) || x.air)) b.onclick = () => { S.night = ds; rerender(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      cal.appendChild(b);
    }
    c3.appendChild(cal);
    c3.appendChild(h('div', 'calscale', 'meno <i style="background:var(--bad)"></i><i style="background:color-mix(in srgb, var(--warn) 50%, var(--bad))"></i><i style="background:var(--warn)"></i><i style="background:color-mix(in srgb, var(--good) 60%, var(--warn))"></i><i style="background:var(--good)"></i> più · colonne = settimane, da lunedì'));
    v.appendChild(c3);
  }

  // =========================================================================
  // CORPO
  // =========================================================================
  function viewCorpo(v) {
    v.appendChild(h('div', 'vtitle', '<h1>Corpo</h1>'));
    if (!body.length) { v.appendChild(h('p', 'empty', 'Nessuna pesata ancora.')); return; }
    const M = { w: ['Peso', 'kg', 1, -1], fat: ['Grasso', '%', 1, -1], muscle: ['Muscoli', '%', 1, 1], water: ['Acqua', '%', 1, 1], bmi: ['BMI', '', 1, -1], visfat: ['Viscerale', '', 0, -1] };
    if (!M[S.cMetric]) S.cMetric = 'w';
    const m = M[S.cMetric], lb = body[body.length - 1], endD = dayNum(lb.date);
    const pts = body.filter(b => dayNum(b.date) > endD - S.cPeriod && isNum(b[S.cMetric])).map(b => [dayNum(b.date), b[S.cMetric], b.date]);
    const c = h('div', 'card');
    c.appendChild(chips(Object.keys(M).map(k => [k, M[k][0]]), S.cMetric, k => { S.cMetric = k; save(); rerender(); }));
    c.appendChild(chips([[90, '3 m'], [365, '1 a'], [1095, '3 a'], [99999, 'Tutto']], S.cPeriod, k => { S.cPeriod = k; save(); rerender(); }, 'seg'));
    if (pts.length) {
      const first = pts[0], last = pts[pts.length - 1], d = last[1] - first[1];
      const good = d * m[3] >= 0;
      c.appendChild(h('div', '', `<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><div class="big"><span data-count="${last[1]}" data-dec="${m[2]}">0</span><small>${m[1]}</small></div>
        ${pts.length > 1 ? `<span class="delta ${Math.abs(d) < .05 ? '' : good ? 'good' : 'warn'}">${d > 0 ? '+' : ''}${fmt(d, m[2])} ${m[1]} dal ${dLabelY(first[2])}</span>` : ''}</div>`));
      const roll = pts.map((p, i) => [p[0], avg(pts.slice(Math.max(0, i - 2), i + 3).map(q => q[1]))]);
      lineChart(c, { h: 210, series: [{ data: pts, color: 'var(--muted)', line: false, dots: pts.length > 80 ? 1.8 : 2.6, dotOpacity: .6 }, { data: roll, color: 'var(--accent)', area: true, w: 2.2 }],
        xTicks: dateTicks, tip: p => `${dLabelY(p[2])} · <b>${fmt(p[1], m[2])}</b> ${m[1]}`, aria: 'Andamento ' + m[0] });
      c.appendChild(h('p', 'hint', 'Linea: media delle pesate vicine, per leggere la tendenza sotto gli sbalzi della bilancia. Scorri per leggere ogni pesata.'));
    } else c.appendChild(h('p', 'empty', 'Nessuna pesata in questo periodo.'));
    v.appendChild(c);
    v.appendChild(h('div', 'grid2 grid4', stat('Peso', fmt(lb.w, 1), 'kg', 'BMI ' + fmt(lb.bmi, 1), '') + stat('Grasso', fmt(lb.fat, 1), '%', 'viscerale ' + fmt(lb.visfat), '') + stat('Muscoli', fmt(lb.muscle, 1), '%', 'ossa ' + fmt(lb.bone, 1) + ' kg', '') + stat('Acqua', fmt(lb.water, 1), '%', dLabelY(lb.date), '')));
    const an = analysis();
    if (an.weight) {
      const up = an.weight.perMonth > 0, flat = Math.abs(an.weight.perMonth) < .2;
      v.appendChild(h('div', 'card', noteHTML({ s: flat ? 'good' : up ? 'warn' : 'good', i: up ? 'up' : 'down', t: flat ? `<strong>Peso stabile</strong> negli ultimi 6 mesi.` : `<strong>Peso ${up ? 'in aumento' : 'in calo'}</strong> di circa <span class="num">${fmt(Math.abs(an.weight.perMonth), 1)}</span> kg al mese negli ultimi 6 mesi.`, tip: `Stima robusta agli sbalzi (Theil-Sen) su ${an.weight.n} pesate.` })));
    }
    const rec = body.slice(-8).reverse();
    const lc = h('div', 'card', '<span class="eyebrow">Ultime pesate</span>');
    const ls = h('div', 'list');
    rec.forEach((b, i) => { const p = body[body.length - 1 - i - 1]; const d = p ? b.w - p.w : null;
      ls.appendChild(h('div', 'row', `<span>${dLabelY(b.date)}</span><span class="num">${fmt(b.w, 1)} kg</span><span class="num small ${d === null ? 'muted' : d > 0 ? 'warn' : 'good'}">${d === null ? '' : (d > 0 ? '+' : '') + fmt(d, 1)}</span>`)); });
    lc.appendChild(ls); v.appendChild(lc);
  }

  // =========================================================================
  // CASA
  // =========================================================================
  function viewCasa(v) {
    v.appendChild(h('div', 'vtitle', `<h1>Casa</h1><span class="muted small">${DATA.room ? 'lettura delle ' + esc(DATA.room.ts.slice(11, 16)) : ''}</span>`));
    const rm = DATA.room, hb = DATA.hub;
    if (rm) {
      const c = h('div', 'card');
      c.appendChild(h('div', 'chead', '<span class="eyebrow">Camera da letto</span>' + (isNum(rm.bat) ? `<span class="muted small">batteria ${fmt(rm.bat)} %</span>` : '')));
      c.appendChild(h('div', 'hero-row', `<div><div class="big ${co2State(rm.co2)}"><span data-count="${rm.co2}">0</span><small>ppm CO2</small></div><p class="muted small">${rm.co2 <= 800 ? 'Aria buona' : rm.co2 <= 1000 ? 'Aria discreta' : 'Da ventilare'}</p></div><div></div>`));
      c.appendChild(h('div', 'grid2', stat('Temperatura', fmt(rm.temp, 1), '°C', 'per dormire 17-20', tempState(rm.temp)) + stat('Umidità', fmt(rm.rh), '%', 'ideale 40-60', rhState(rm.rh))));
      v.appendChild(c);
    }
    if (hb) v.appendChild(h('div', 'card', `<span class="eyebrow">Seconda stanza</span><div class="grid2">${stat('Temperatura', fmt(hb.temp, 1), '°C', 'Hub 2', '')}${stat('Umidità', fmt(hb.rh), '%', 'luce ' + fmt(hb.light) + '/20', rhState(hb.rh))}</div>`));

    const rec = DATA.recent || [];
    if (rec.length) {
      const c = h('div', 'card');
      c.appendChild(h('div', 'chead', '<span class="eyebrow">Storico recente</span>'));
      c.appendChild(chips([['co2', 'CO2'], ['temp', 'Temperatura'], ['rh', 'Umidità']], S.hMetric, k => { S.hMetric = k; save(); rerender(); }));
      c.appendChild(chips([[1, '24 h'], [3, '3 g'], [7, '7 g']], S.hPeriod, k => { S.hPeriod = k; save(); rerender(); }, 'seg'));
      const lastT = rec[rec.length - 1][0], from = lastT - S.hPeriod * 1440;
      const r = rec.filter(p => p[0] >= from);
      const col = { co2: 1, temp: 2, rh: 3 }[S.hMetric], hcol = { temp: 4, rh: 5 }[S.hMetric];
      const unit = { co2: 'ppm', temp: '°C', rh: '%' }[S.hMetric], dec = S.hMetric === 'temp' ? 1 : 0;
      const ticks = (a, b) => { const out = []; const stepH = S.hPeriod === 1 ? 6 : S.hPeriod === 3 ? 12 : 24;
        for (let m2 = Math.ceil(a / (stepH * 60)) * stepH * 60; m2 <= b; m2 += stepH * 60) { const dt = absToDate(m2); out.push([m2, stepH >= 24 || dt.getUTCHours() === 0 ? dt.getUTCDate() + ' ' + MESI[dt.getUTCMonth()] : String(dt.getUTCHours()).padStart(2, '0') + ':00']); } return out; };
      const series = [{ data: r.map(p => [p[0], p[col]]), color: S.hMetric === 'co2' ? 'var(--accent)' : 'var(--accent-2)', area: true, gap: 40 }];
      if (hcol) series.push({ data: r.map(p => [p[0], p[hcol]]), color: 'var(--accent-3)', w: 1.6, gap: 40, dash: '4 3' });
      const bands = S.hMetric === 'co2' ? [[800, 1000, 'var(--band-warn)'], [1000, 9999, 'var(--band-bad)']] : S.hMetric === 'temp' ? [[17, 20, 'var(--band-good)']] : [[40, 60, 'var(--band-good)']];
      lineChart(c, { h: 200, series: series, bands: bands, xTicks: ticks, tip: p => { const dt = absToDate(p[0]); const hp = hcol ? r.find(q => q[0] === p[0]) : null;
        return `${dt.getUTCDate()} ${MESI[dt.getUTCMonth()]} ${String(dt.getUTCHours()).padStart(2, '0')}:${String(dt.getUTCMinutes()).padStart(2, '0')} · <b>${fmt(p[1], dec)}</b> ${unit}${hp && isNum(hp[hcol]) ? ' · altra stanza <b>' + fmt(hp[hcol], dec) + '</b>' : ''}`; }, aria: 'Storico ' + unit });
      if (hcol) c.appendChild(h('div', 'legend', '<span><i class="sw" style="background:var(--accent-2)"></i>camera</span><span><i class="sw" style="background:var(--accent-3)"></i>seconda stanza</span>'));
      v.appendChild(c);
    }
    const an = nights.filter(n => n.air);
    if (an.length) {
      const c = h('div', 'card');
      c.appendChild(h('div', 'chead', `<span class="eyebrow">CO2 media per notte</span><span class="muted small">${an.length} ${an.length === 1 ? 'notte' : 'notti'}</span>`));
      const box = h('div', 'bars'); box.style.gridTemplateColumns = `repeat(${Math.min(an.length, 14)}, minmax(0, 1fr))`;
      const sl = an.slice(-14), mx = Math.max(1200, Math.max.apply(null, sl.map(n => n.air.co2_max)));
      sl.forEach(n => { const b = h('button', 'bar', `<span class="v small">${fmt(n.air.co2_avg)}</span><div class="col"><div class="fill" data-hgt="${(100 * n.air.co2_avg / mx).toFixed(0)}%" style="background:var(--${co2State(n.air.co2_avg)})"></div></div><span class="k">${dLabel(n.date)}</span>`);
        b.onclick = () => go('sonno', { night: n.date }); box.appendChild(b); });
      c.appendChild(box);
      c.appendChild(h('p', 'hint', 'Tocca una notte per aprirla nella sezione Sonno.'));
      v.appendChild(c);
    }
  }

  // =========================================================================
  // ANALISI
  // =========================================================================
  function viewAnalisi(v) {
    const an = analysis();
    v.appendChild(h('div', 'vtitle', `<h1>Analisi</h1><span class="muted small">${gNights.length} notti · ${an.tested} confronti</span>`));
    const F = [['all', 'Tutto'], ['score', 'Sleep score'], ['hrv', 'HRV'], ['rhr', 'Battito'], ['bb', 'Body Battery'], ['deep', 'Profondo']];
    v.appendChild(chips(F, S.aFilter, k => { S.aFilter = k; save(); rerender(); }));
    const list = an.findings.filter(t => S.aFilter === 'all' || t.o.id === S.aFilter);
    if (list.length) {
      list.forEach((t, i) => {
        const good = (t.dir * t.o.better) > 0, strong = t.p < 0.01 && t.strength >= 0.4;
        const c = h('div', 'card find' + (i === 0 ? ' open' : ''));
        const vmax = Math.max.apply(null, t.groups.map(g => g.v)), vmin = Math.min.apply(null, t.groups.map(g => g.v));
        const bars = `<div class="bars" style="grid-template-columns:repeat(${t.groups.length},minmax(0,1fr))">${t.groups.map(g => `<div class="bar${g.hi ? ' hi' : ''}"><span class="v">${fmt(g.v, t.o.dec)}</span><div class="col"><div class="fill" data-hgt="${(25 + 75 * (g.v - vmin) / ((vmax - vmin) || 1)).toFixed(0)}%"></div></div><span class="k">${esc(g.k)} · ${g.n}</span></div>`).join('')}</div>`;
        c.innerHTML = `<div class="meta"><span class="tag ${good ? 'good' : 'bad'}">${good ? 'ti aiuta' : 'ti penalizza'}</span><span class="tag n">${strong ? 'evidenza forte' : 'evidenza moderata'}</span><span class="tag n">${t.n} notti</span></div>
          <h3>${esc(findingTitle(t))}</h3>${bars}<div class="body"><p class="muted small">${esc(findingBody(t))}</p><div class="sc"></div></div><span class="more">${i === 0 ? 'Chiudi' : 'Vedi i dati'}</span>`;
        const sc = c.querySelector('.sc');
        let drawn = false;
        const drawScatter = () => {
          if (drawn || t.f.binary) return; drawn = true;
          sc.appendChild(h('span', 'eyebrow', 'Ogni punto è una notte'));
          const pts = t.pairs.map(p => [p[0], p[1], p[2]]).sort((a, b) => a[0] - b[0]);
          const mx = avg(pts.map(p => p[0])), my = avg(pts.map(p => p[1])), den = pts.reduce((s, p) => s + (p[0] - mx) * (p[0] - mx), 0);
          const k = den ? pts.reduce((s, p) => s + (p[0] - mx) * (p[1] - my), 0) / den : 0;
          const xa = pts[0][0], xb = pts[pts.length - 1][0];
          const ticks = (a, b) => { const st = niceStep((b - a) / 4), out = []; for (let x = Math.ceil(a / st) * st; x <= b; x += st) out.push([x, t.f.id === 'bed' ? clock(x) : fmt(x, st < 1 ? 1 : 0)]); return out; };
          lineChart(sc, { h: 200, series: [{ data: pts, color: 'var(--accent)', line: false, dots: 3.4, dotOpacity: .7 }, { data: [[xa, my + k * (xa - mx)], [xb, my + k * (xb - mx)]], color: 'var(--fg)', w: 1.2, dash: '4 3', opacity: .5 }],
            xTicks: ticks, tip: p => `${dLabel(p[2])} · ${esc(t.f.show(p[0]))} · <b>${fmt(p[1], t.o.dec)}</b>${t.o.unit}`, onPick: p => go('sonno', { night: p[2] }), aria: 'Grafico a punti' });
          sc.appendChild(h('p', 'hint', `Orizzontale: ${t.f.axis}. Verticale: ${t.o.label}. Tocca un punto per aprire la notte.`));
        };
        if (i === 0) setTimeout(drawScatter, 50);
        c.onclick = e => { if (e.target.closest('.chart')) return; const open = c.classList.toggle('open'); c.querySelector('.more').textContent = open ? 'Chiudi' : 'Vedi i dati'; if (open) drawScatter(); };
        v.appendChild(c);
      });
    } else v.appendChild(h('p', 'empty', 'Per ora nessuna relazione abbastanza solida per questo filtro. Le scoperte compaiono man mano che i dati crescono.'));

    if (an.trends.length) {
      const c = h('div', 'card', '<span class="eyebrow">Tendenze delle ultime 2 settimane</span>');
      an.trends.forEach(tt => { const good = (tt.diff * tt.o.better) > 0;
        c.insertAdjacentHTML('beforeend', noteHTML({ s: good ? 'good' : 'warn', i: tt.diff > 0 ? 'up' : 'down', t: `<strong>${tt.o.label.replace(/^./, x => x.toUpperCase())} ${tt.diff > 0 ? 'in aumento' : 'in calo'}</strong>: <span class="num">${fmt(tt.now, tt.o.dec)}</span>${tt.o.unit} contro ${fmt(tt.was, tt.o.dec)}${tt.o.unit} nelle 4 settimane prima.` })); });
      v.appendChild(c);
    }
    if (an.learning.length) {
      const c = h('div', 'card', `<div class="chead"><span class="eyebrow">Sto ancora imparando</span><span class="muted small">servono ${an.MIN_N} notti</span></div>`);
      an.learning.forEach(l => c.insertAdjacentHTML('beforeend', `<div class="prog"><span>Effetto della ${esc(l.f.label)} sul sonno · <span class="num">${l.n}/${an.MIN_N}</span></span><div class="track"><i data-w="${Math.min(100, 100 * l.n / an.MIN_N).toFixed(0)}%"></i></div></div>`));
      v.appendChild(c);
    }
    v.appendChild(h('div', 'card', `<details class="how"><summary>Come funziona l'analisi</summary><ul>
      <li>Confronto 8 fattori (ora e regolarità del sonno, passi e stress del giorno prima, CO2, temperatura e umidità della camera, weekend) con 5 risultati (sleep score, HRV, battito a riposo, Body Battery, sonno profondo).</li>
      <li>Correlazione di Spearman, verificata con un test di permutazione (1500 rimescolamenti): niente ipotesi sulla forma dei dati.</li>
      <li>Correzione di Benjamini-Hochberg per i confronti multipli: con tanti confronti alcune coincidenze sono inevitabili, e qui vengono scartate.</li>
      <li>Non confronto lo sleep score con le sue componenti (durata, fasi): sarebbe un risultato scontato.</li>
      <li>Sono associazioni, non prove di causa: usale come ipotesi da provare (per esempio una settimana a letto entro le 23).</li></ul></details>`));
  }

  // avvio
  const start = (location.hash || '').replace('#', '');
  go(TABS.some(t => t[0] === start) ? start : 'oggi');
})();
</script>
</body>
</html>
